[package]
name = "yuzuha"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
description = "A library for computing SU(2) X-symbols for arbitrary tensor network contractions"
keywords = ["tensor-network", "su2", "quantum", "clebsch-gordan", "fusion-trees"]
categories = ["algorithms", "mathematics", "science"]
readme = "README.md"

[dependencies]
ndarray = "0.17"
ndarray-einsum = "0.9"
thiserror = "2.0"
once_cell = "1.20"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[profile.test]
opt-level = 2
