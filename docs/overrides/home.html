{% extends "main.html" %}

{% block tabs %}
  {{ super() }}
  <style>
    .md-header { display: none; }
    .md-main { display: none; }
    .md-content { display: none; }
  </style>

  <section class="mdx-hero">
    <div class="mdx-hero__image">
      <img src="{{ base_url }}/images/hero.png" alt="Yuzuha hero" draggable="false">
    </div>
    <div class="mdx-hero__content">
      <h1>Yuzuha</h1>
      <p>High-performance SU(2) recoupling backend engine for tensor network algorithms.</p>
      <a href="{{ base_url }}/getting-started/what-is-yuzuha/" class="md-button md-button--primary">
        Get Started
      </a>
      <a href="{{ base_url }}/api/" class="md-button">
        API Reference
      </a>
    </div>
  </section>
{% endblock %}

{% block content %}{% endblock %}
{% block footer %}{% endblock %}
